# 自動產生新單字的英式語音（Google Cloud Text-to-Speech，en-GB-Neural2-C）
# 需要 repo secret：GOOGLE_TTS_API_KEY（Settings → Secrets and variables → Actions）
name: 產生語音

on:
  push:
    branches: [main]
    paths: [data/words.csv]
  workflow_run:
    workflows: [單字申請單]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phonics-data
  cancel-in-progress: false

jobs:
  audio:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 產生語音
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: python3 scripts/build_audio.py
      - name: 存檔並推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then echo "沒有新的語音"; else git commit -m "自動產生語音" && (git push || (git pull --rebase && git push)); fi
