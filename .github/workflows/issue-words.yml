# 處理家長專區送出的單字申請單，寫進 data/words.csv
# 安全：只處理 repo 擁有者自己開的申請單
name: 單字申請單

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: phonics-data
  cancel-in-progress: false

jobs:
  process:
    if: github.event.issue.user.login == github.repository_owner && contains(github.event.issue.body, 'pc-action:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 寫進單字表
        id: words
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          RESULT_FILE: ${{ runner.temp }}/result.md
        run: python3 scripts/process_issue.py
        continue-on-error: true
      - name: 存檔並推送
        if: steps.words.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/words.csv
          if git diff --cached --quiet; then echo "沒有變更"; else git commit -m "單字申請單 #${{ github.event.issue.number }}" && (git push || (git pull --rebase && git push)); fi
      - name: 回覆並關閉申請單
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file "${{ runner.temp }}/result.md"
          if [ "${{ steps.words.outcome }}" = "success" ]; then gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}; fi
